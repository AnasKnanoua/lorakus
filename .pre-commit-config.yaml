repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Verrou de pnpm : plusieurs documents YAML par fichier (format pnpm 12), genere par
        # l'outil et valide en CI par pnpm install --frozen-lockfile.
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (detection de secrets)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff (formatage)
        entry: uv --directory backend run ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-check
        name: ruff (lint + securite)
        entry: uv --directory backend run ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
