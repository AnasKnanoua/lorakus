[project]
name = "lorakus"
dynamic = ["version"]
description = "Lorakus : backend (Core platform et modules)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1,<1.32",
    "packaging>=26.3",
    "procrastinate>=3.10.0,<3.11",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "tokenizers>=0.23.3,<0.24",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Version lue dans lorakus/__init__.py, mise a jour par release-please : uv.lock n'a pas a
# changer a chaque version (uv sync --locked reste valide sur la PR de version).
[tool.hatch.version]
path = "lorakus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lorakus", "lorakus_modules"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.15,<2.16",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# --- Ruff : linter + formateur ---------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # erreurs de style (PEP 8)
    "F",        # erreurs logiques (variables inutilisées, imports manquants...)
    "I",        # ordre des imports
    "B",        # bugs fréquents (flake8-bugbear)
    "UP",       # syntaxe Python moderne
    "S",        # sécurité (équivalent de Bandit)
    "SIM",      # simplifications
    "N",        # conventions de nommage
    "ASYNC",    # pièges du code asynchrone
    "RUF",      # règles propres à Ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert et faux mots de passe sont normaux dans les tests
"alembic/versions/**" = ["F401"]      # le modele importe sqlalchemy meme si une migration ne l'utilise pas
"lorakus_modules/*/prompts.py" = ["E501"]  # texte envoye au modele : pas de coupure artificielle
"lorakus/core/*/prompts.py" = ["E501"]

# --- Pyright : vérification des types --------------------------------------
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["lorakus", "lorakus_modules"]
include = ["lorakus", "lorakus_modules", "tests"]
venvPath = "."
venv = ".venv"

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: necessite PostgreSQL (make test-all)"]

# --- import-linter : frontieres d'architecture (make lint, donc la CI) ---------------
# Les dependances ne vont que dans un sens : modules -> Core -> infrastructure.
[tool.importlinter]
root_packages = ["lorakus", "lorakus_modules"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Le Core n'importe jamais un module"
type = "forbidden"
source_modules = ["lorakus"]
forbidden_modules = ["lorakus_modules"]

[[tool.importlinter.contracts]]
name = "Les modules sont independants les uns des autres"
type = "independence"
modules = ["lorakus_modules.*"]

[[tool.importlinter.contracts]]
name = "Les modules ne touchent ni a Procrastinate ni au relais d'evenements (ADR 0004)"
type = "forbidden"
source_modules = ["lorakus_modules"]
forbidden_modules = ["procrastinate", "lorakus.core.jobs.procrastinate_queue", "lorakus.core.events.relay"]

[[tool.importlinter.contracts]]
name = "Seul l'adaptateur du Core importe Procrastinate"
type = "forbidden"
source_modules = ["lorakus.api", "lorakus.cli", "lorakus.core.events", "lorakus.core.identity", "lorakus.core.modules", "lorakus.db"]
forbidden_modules = ["procrastinate"]

[[tool.importlinter.contracts]]
name = "Couches : api, cli, worker -> core -> moteur IA -> infrastructure -> reglages"
type = "layers"
layers = [
    "lorakus.api | lorakus.cli | lorakus.worker",
    "lorakus.core",
    "lorakus.ai",
    "lorakus.db | lorakus.observability",
    "lorakus.settings",
]

# Seule la racine de composition (lorakus.api) choisit les adaptateurs ; le Core et les
# modules ne voient que le ModelRouter et le port (MODULE_SYSTEM.md §1, regle 1).
[[tool.importlinter.contracts]]
name = "Ni le Core ni les modules n'importent les adaptateurs d'IA"
type = "forbidden"
source_modules = ["lorakus.core", "lorakus.cli", "lorakus.worker", "lorakus_modules"]
forbidden_modules = ["lorakus.ai.providers"]

# Dans le moteur IA, seuls les adaptateurs touchent un SDK de fournisseur ou un moteur
# d'inference local (ONNX Runtime, tokenizers : PR 37). Le test
# tests/unit/test_ai_boundaries.py verifie la meme regle pour tout fichier, meme nouveau.
[[tool.importlinter.contracts]]
name = "Seuls les adaptateurs importent un SDK d'IA"
type = "forbidden"
source_modules = ["lorakus.ai.port", "lorakus.ai.router", "lorakus.ai.catalog", "lorakus.ai.usage", "lorakus.ai.breaker", "lorakus.ai.testing", "lorakus.ai.embeddings", "lorakus.core", "lorakus.api", "lorakus.db", "lorakus_modules"]
forbidden_modules = ["anthropic", "onnxruntime", "tokenizers"]
allow_indirect_imports = true  # l'API importe la fabrique ; elle ne doit pas appeler le SDK

# Modules decouverts par le Core.
[project.entry-points."lorakus.modules"]
assistant = "lorakus_modules.assistant.manifest:manifest"
