# Services communs a tous les environnements (dev, staging, production).
# En local, toujours via le Makefile : make up, make down, make db-up, ...
name: lorakus

# Journaux : rotation (10 Mo x 3 par conteneur) pour ne jamais remplir le disque,
# et nom du conteneur ajoute a chaque ligne.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# Durcissement des conteneurs de l'application (API, migrations, sauvegardes).
x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]

services:
  postgres:
    image: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      LORAKUS_MIGRATOR_DB_PASSWORD: ${LORAKUS_MIGRATOR_DB_PASSWORD:?manquant dans .env}
      LORAKUS_APP_DB_PASSWORD: ${LORAKUS_APP_DB_PASSWORD:?manquant dans .env}
      # Chiffrement des secrets TOTP. Facultative en developpement (double authentification
      # alors indisponible) ; obligatoire en staging et en production, creee par init-env.sh.
      LORAKUS_FIELD_ENCRYPTION_KEY: ${LORAKUS_FIELD_ENCRYPTION_KEY:-}
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (et non plus .../data).
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  # Conteneur ponctuel : applique les migrations puis s'arrete (make up, deploiement).
  migrate:
    <<: *app-hardening
    image: ${LORAKUS_API_IMAGE:-lorakus-api:dev}
    command: ["alembic", "upgrade", "heads"]
    restart: "no"
    profiles: ["tools"]
    environment:
      LORAKUS_ENVIRONMENT: ${LORAKUS_ENVIRONMENT:-development}
      LORAKUS_DB_HOST: postgres
      LORAKUS_MIGRATOR_DB_PASSWORD: ${LORAKUS_MIGRATOR_DB_PASSWORD:?manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  api:
    <<: *app-hardening
    image: ${LORAKUS_API_IMAGE:-lorakus-api:dev}
    restart: unless-stopped
    environment:
      LORAKUS_ENVIRONMENT: ${LORAKUS_ENVIRONMENT:-development}
      LORAKUS_DB_HOST: postgres
      LORAKUS_APP_DB_PASSWORD: ${LORAKUS_APP_DB_PASSWORD:?manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384m

  # Conteneur ponctuel : sauvegarde chiffree vers B2 (make backup ; minuteur en production).
  # Il ne recoit que la cle PUBLIQUE age et une cle B2 sans droit de suppression.
  backup:
    <<: *app-hardening
    image: ${LORAKUS_BACKUP_IMAGE:-lorakus-backup:dev}
    tmpfs: ["/tmp:size=512m"]
    restart: "no"
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      PGUSER: lorakus_migrator
      PGPASSWORD: ${LORAKUS_MIGRATOR_DB_PASSWORD:?manquant dans .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT manquant dans .env}
      B2_BUCKET: ${B2_BUCKET:?B2_BUCKET manquant dans .env}
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_KEY_ID:?B2_KEY_ID manquant dans .env}
      RCLONE_CONFIG_B2_KEY: ${B2_APP_KEY:?B2_APP_KEY manquant dans .env}
    volumes:
      # Resultat de chaque sauvegarde, lu par node_exporter (alertes BackupFailed / BackupMissing).
      - backup-metrics:/metrics
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  internal:

volumes:
  postgres-data:
  backup-metrics:
