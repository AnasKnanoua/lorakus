# Exceptions de l'analyse des secrets de Trivy (images API et sauvegarde).
#
# Une exception de Trivy porte soit sur un chemin, soit sur le texte du secret : les deux ne
# se combinent pas. On n'exempte donc que des chemins precis de code tiers ; partout
# ailleurs, toutes les regles restent bloquantes.
allow-rules:
  # SDK Anthropic 2.3 : la documentation de l'API beta « agents » cite {"type": "service_account"}
  # comme valeur par defaut. La regle gcp-service-account de Trivy cherche exactement ce texte,
  # qui est aussi celui d'un vrai fichier de cle Google : une exception par texte masquerait
  # donc aussi les vraies cles. Exception limitee aux deux dossiers concernes du SDK, ou
  # Lorakus n'ecrit jamais rien (installes depuis uv.lock, empreintes verifiees).
  # Faux positif constate le 2026-11-12 (PR 32). A revoir a chaque mise a jour du SDK.
  - id: anthropic-sdk-beta-agents-docstrings
    description: Documentation du SDK Anthropic (exemple {"type":"service_account"}), pas une cle
    path: 'site-packages/anthropic/(resources/beta/agents|types/beta)/'
