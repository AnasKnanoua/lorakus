# Traces (Tempo) et journaux (Loki), PR 40. Charges au demarrage, non modifiables dans
# l'interface. Liens dans les deux sens :
# - d'un span vers ses journaux : meme service, meme trace_id (metadonnee structuree OTLP) ;
# - d'un journal vers sa trace : le champ "trace_id" de la ligne JSON.
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: Trace
          datasourceUid: tempo
          matcherRegex: '"trace_id": "([0-9a-f]{32})"'
          url: "$${__value.raw}"
          urlDisplayLabel: Voir la trace
