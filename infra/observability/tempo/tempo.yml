# Tempo (traces, PR 40, ADR 0010) : un seul processus, stockage local, 3 jours de retention.
# Recoit les traces de l'API et du worker en OTLP/HTTP sur le reseau interne seulement ;
# lu par Grafana. Aucun port publie sur l'hote.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3 : la retention est appliquee par le backend-worker (l'ancien bloc `compactor` de
# Tempo 2 n'existe plus).
backend_worker:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Statistiques d'usage envoyees par defaut a Grafana Labs : coupees (comme ONNX Runtime).
usage_report:
  reporting_enabled: false
