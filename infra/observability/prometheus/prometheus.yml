# Ce que Prometheus collecte, les regles qu'il evalue, et ou il envoie les alertes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Ajoute a chaque alerte envoyee : distingue production, staging et developpement dans Discord.
  # Prometheus remplace ${...} par la variable d'environnement du conteneur (compose.observability.yml).
  external_labels:
    environment: ${LORAKUS_ENVIRONMENT}

rule_files:
  - /etc/prometheus/rules/*.yml

# Cibles propres a un environnement (production : Caddy). Dossier absent en developpement.
scrape_config_files:
  - /etc/prometheus-extra/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Metriques de l'API (port separe 9464, jamais publie).
  - job_name: lorakus-api
    static_configs:
      - targets: ["api:9464"]

  # Machine (disque, memoire, CPU) et resultats des sauvegardes.
  - job_name: lorakus-worker
    static_configs:
      - targets: ["worker:9464"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus et Alertmanager se surveillent aussi.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Traces et journaux (PR 40) : surveilles pour savoir quand ils ne recoivent plus rien.
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
