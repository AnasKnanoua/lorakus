# Ce que Prometheus collecte, les regles qu'il evalue, et ou il envoie les alertes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Metriques de l'API (port separe 9464, jamais publie).
  - job_name: lorakus-api
    static_configs:
      - targets: ["api:9464"]

  # Prometheus et Alertmanager se surveillent aussi.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
