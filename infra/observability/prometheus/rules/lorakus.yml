# Regles d'alerte de Lorakus, evaluees par Prometheus.
# Chaque regle est couverte par un test : infra/observability/prometheus/tests.
# Le label "component" sert a l'inhibition : une alerte critique d'un composant
# masque les avertissements de ce meme composant (pas ceux des autres).
# Chaque regle porte une annotation runbook_url vers docs/runbooks/ (lien affiche dans Discord ;
# verifie par infra/observability/check-runbooks.sh).
groups:
  - name: lorakus-api
    rules:
      - alert: LorakusApiDown
        expr: up{job="lorakus-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: L'API Lorakus est injoignable
          description: Prometheus ne parvient plus a collecter les metriques de l'API depuis 2 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/api-down.md

      - alert: LorakusHighErrorRate
        expr: |
          (
            sum(rate(lorakus_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(lorakus_http_requests_total[5m]))
          ) > 0.05
          and sum(rate(lorakus_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: Plus de 5 % d'erreurs serveur sur l'API
          description: Plus de 5 % des requetes se terminent en erreur 5xx depuis 5 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/api-down.md

      - alert: LorakusHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(lorakus_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: L'API Lorakus est lente
          description: Le 95e centile de la duree des requetes depasse 1 seconde depuis 10 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/api-down.md

      - alert: LorakusApiHighMemory
        expr: process_resident_memory_bytes{job="lorakus-api"} > 650 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: L'API Lorakus consomme beaucoup de memoire
          description: L'API depasse 650 Mo depuis 10 minutes (limite du conteneur 768 Mo ; environ 545 Mo au repos avec le modele d'embeddings).
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/api-down.md

  - name: lorakus-worker
    rules:
      - alert: LorakusWorkerDown
        expr: up{job="lorakus-worker"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: Le worker Lorakus est injoignable
          description: Prometheus ne collecte plus les metriques du worker depuis 2 minutes ; jobs et evenements ne sont plus traites.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/worker.md

      - alert: LorakusWorkerStalled
        expr: time() - lorakus_worker_heartbeat_timestamp_seconds > 120
        for: 1m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: Le worker Lorakus est bloque
          description: Son battement de coeur n'a pas avance depuis plus de 2 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/worker.md

      - alert: LorakusWorkerHighMemory
        expr: process_resident_memory_bytes{job="lorakus-worker"} > 200 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: Le worker Lorakus consomme beaucoup de memoire
          description: Le worker depasse 200 Mo depuis 10 minutes (limite du conteneur 256 Mo).
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/worker.md

      - alert: LorakusOutboxBacklog
        expr: lorakus_outbox_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: Des evenements attendent depuis plus de 5 minutes
          description: L'evenement en attente le plus ancien a plus de 5 minutes ; un handler echoue ou le worker est sature.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/worker.md

      - alert: LorakusOutboxDeadEvents
        expr: lorakus_outbox_dead > 0
        for: 1m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: Des evenements ont ete abandonnes
          description: Au moins un evenement a echoue 8 fois et n'est plus retente ; voir last_error dans core_outbox.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/worker.md

  - name: lorakus-backup
    rules:
      - alert: LorakusBackupFailed
        expr: lorakus_backup_last_success == 0
        for: 1m
        labels:
          severity: warning
          component: backup
        annotations:
          summary: La derniere sauvegarde a echoue
          description: La derniere tentative de sauvegarde vers B2 s'est terminee en erreur. Voir les journaux du conteneur backup.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/backup-failed.md

      - alert: LorakusBackupMissing
        expr: time() - lorakus_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
          component: backup
        annotations:
          summary: Aucune sauvegarde reussie depuis plus de 26 heures
          description: La derniere sauvegarde reussie date de plus de 26 heures. Les donnees recentes ne sont pas protegees.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/backup-failed.md

      - alert: LorakusBackupNeverRecorded
        expr: absent(lorakus_backup_last_attempt_timestamp_seconds)
        for: 26h
        labels:
          severity: critical
          component: backup
        annotations:
          summary: Aucune tentative de sauvegarde enregistree depuis 26 heures
          description: Le minuteur de sauvegarde ne s'execute plus, ou ses metriques ne sont plus lues.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/backup-failed.md

  # Sentinelle externe (ADR 0037). LorakusWatchdog est TOUJOURS active : Alertmanager l'envoie
  # chaque minute a healthchecks.io (production uniquement), jamais a Discord. Si ce signal de
  # vie s'arrete (serveur eteint, Prometheus ou Alertmanager arretes, reseau coupe),
  # healthchecks.io previent Discord de l'exterieur.
  - name: lorakus-sentinel
    rules:
      - alert: LorakusWatchdog
        expr: vector(1)
        labels:
          severity: none
          component: sentinel
        annotations:
          summary: Signal de vie de Lorakus
          description: Alerte toujours active, transmise a la sentinelle externe. Sa disparition signifie que la production ne surveille plus rien.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/production-down.md

      - alert: LorakusHeartbeatFailing
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
          component: sentinel
        annotations:
          summary: Le signal de vie n'atteint plus la sentinelle externe
          description: Alertmanager n'arrive plus a joindre healthchecks.io ; la sentinelle va bientot declarer la production disparue.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/production-down.md

  - name: lorakus-host
    rules:
      - alert: LorakusDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: Moins de 15 % d'espace disque libre
          description: Le disque principal du serveur a moins de 15 % d'espace libre depuis 10 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/disk-full.md

      - alert: LorakusDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.05
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: Moins de 5 % d'espace disque libre
          description: Le disque principal est presque plein. PostgreSQL risque de s'arreter.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/disk-full.md

      - alert: LorakusHostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: Moins de 10 % de memoire disponible sur le serveur
          description: La memoire disponible du serveur est inferieure a 10 % depuis 10 minutes.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/host.md

      - alert: LorakusNodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: Les metriques du serveur ne sont plus collectees
          description: node_exporter est injoignable depuis 5 minutes (disque, memoire et sauvegardes non surveilles).
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/host.md

  # Moteur IA et assistant (PR 33). Metriques lorakus_ai_* (ModelRouter) et
  # lorakus_assistant_replies_total (module assistant).
  - name: lorakus-ai
    rules:
      - alert: LorakusAiProviderFailing
        expr: |
          sum(increase(lorakus_ai_requests_total{outcome!="ok"}[15m])) >= 3
          and (sum(increase(lorakus_ai_requests_total{outcome="ok"}[15m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: Le fournisseur d'IA echoue
          description: Au moins 3 appels IA en echec et aucun reussi en 15 minutes. L'assistant repond par son message de secours.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/ai.md#lorakusaiproviderfailing

      - alert: LorakusAiUsageNotRecorded
        expr: increase(lorakus_ai_usage_record_failures_total[1h]) > 0
        labels:
          severity: warning
          component: ai
        annotations:
          summary: Des depenses IA n'ont pas ete enregistrees
          description: Au moins un appel IA reussi n'a pas pu etre ecrit dans core_ai_usage. Le plafond mensuel le sous-estime.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/ai.md#lorakusaiusagenotrecorded

      - alert: LorakusAiSpendHigh
        expr: sum(increase(lorakus_ai_cost_usd_total[24h])) > 0.5
        labels:
          severity: warning
          component: ai
        annotations:
          summary: Depense IA anormale
          description: Plus de 0,50 dollar d'IA en 24 heures, environ dix fois l'usage attendu. Possible boucle ou abus.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/ai.md#lorakusaispendhigh

      - alert: LorakusAiBudgetReached
        expr: sum(increase(lorakus_ai_refusals_total{reason="budget"}[1h])) > 0
        labels:
          severity: warning
          component: ai
        annotations:
          summary: Plafond IA mensuel atteint
          description: Des messages ont recu la reponse de secours car le plafond mensuel d'un utilisateur est atteint.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/ai.md#lorakusaibudgetreached

      - alert: LorakusAssistantInternalError
        expr: sum(increase(lorakus_assistant_replies_total{reason="error"}[15m])) > 0
        labels:
          severity: warning
          component: ai
        annotations:
          summary: Erreur interne dans l'assistant
          description: Une reponse s'est terminee par le message d'erreur interne. Une exception est dans les journaux de l'API.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/ai.md#lorakusassistantinternalerror

  # Exposition publique (PR 35) : Caddy, limites par utilisateur, controle d'origine.
  # La cible lorakus-web n'existe qu'en production (prometheus/production/web.yml).
  - name: lorakus-web
    rules:
      - alert: LorakusWebDown
        expr: up{job="lorakus-web"} == 0
        for: 2m
        labels:
          severity: critical
          component: web
        annotations:
          summary: Caddy (app.lorakus.app) est injoignable
          description: Prometheus ne joint plus Caddy depuis 2 minutes. L'interface et l'API ne sont plus accessibles depuis Internet.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/web.md#lorakuswebdown

      - alert: LorakusRateLimited
        expr: sum(increase(lorakus_rate_limited_total[15m])) > 20
        labels:
          severity: warning
          component: web
        annotations:
          summary: Requetes refusees par les limites par utilisateur
          description: Plus de 20 requetes refusees en 15 minutes. Client en boucle, script ou session volee.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/web.md#lorakusratelimited

      - alert: LorakusOriginRefused
        expr: sum(increase(lorakus_origin_refused_total[15m])) > 5
        labels:
          severity: warning
          component: web
        annotations:
          summary: Ecritures refusees car venues d'une autre origine
          description: Plus de 5 ecritures refusees en 15 minutes par le controle d'origine. Tentative CSRF ou adresse publique mal reglee.
          runbook_url: https://github.com/AnasKnanoua/lorakus/blob/main/docs/runbooks/web.md#lorakusoriginrefused
