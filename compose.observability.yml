# Observabilite : Prometheus (metriques), Grafana (tableaux de bord), Tempo (traces) et
# Loki (journaux). S'ajoute a compose.yml : make obs-up en local, inclus aussi au deploiement.
# Ports lies a 127.0.0.1 : en production, acces uniquement par tunnel SSH. Tempo et Loki n'ont
# aucun port publie : seuls l'API, le worker (qui leur envoient) et Grafana (qui les lit) y
# accedent, sur le reseau interne.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  # Traces et copie des journaux (PR 40) : activees seulement quand ce fichier est inclus.
  api:
    environment:
      LORAKUS_OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      LORAKUS_OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs

  worker:
    environment:
      LORAKUS_OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      LORAKUS_OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs

  # Traces (PR 40, ADR 0010) : 3 jours, stockage local. Image sans shell : pas de test de
  # sante Docker ; Prometheus la surveille (alerte LorakusTempoDown).
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Estimation a mesurer apres le premier deploiement (PR 40).
          memory: 256m

  # Journaux (PR 40, ADR 0010) : 7 jours, stockage local, recus en OTLP. Meme surveillance.
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki:/etc/loki:ro
      - loki-data:/loki
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Estimation a mesurer apres le premier deploiement (PR 40).
          memory: 256m

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.external-url=http://localhost:9090
    environment:
      # Etiquette "environment" de toutes les alertes (prometheus.yml, external_labels).
      LORAKUS_ENVIRONMENT: ${LORAKUS_ENVIRONMENT:-development}
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 300m

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana 13.2+ : ne pas re-telecharger ses plugins integres a chaque demarrage.
      # Ce telechargement echoue sur un systeme de fichiers en lecture seule (le plugin
      # Prometheus reste alors desenregistre) et ferait dependre le demarrage d'Internet.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          # 325 Mo mesures le 2026-11-13 (85 % de l'ancienne limite de 384 Mo) : marge refaite.
          memory: 512m


  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: unless-stopped
    environment:
      DISCORD_OPS_WEBHOOK_URL: ${DISCORD_OPS_WEBHOOK_URL:?DISCORD_OPS_WEBHOOK_URL manquant dans .env}
      # Sentinelle externe (ADR 0037) : utilisee en production seulement (voir alertmanager.yml.tmpl).
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-https://hc-ping.com/non-configure}
    # Alertmanager ne lit pas les variables d'environnement dans sa configuration :
    # le fichier final est genere au demarrage, en memoire (/tmp), depuis le modele.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s|__DISCORD_OPS_WEBHOOK_URL__|$${DISCORD_OPS_WEBHOOK_URL}|"
        -e "s|__HEALTHCHECKS_PING_URL__|$${HEALTHCHECKS_PING_URL}|"
        /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    volumes:
      - ./infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m



  # Metriques de la machine (disque, memoire, CPU) et resultats des sauvegardes.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
    volumes:
      # Tout en lecture seule : node_exporter observe la machine sans rien pouvoir y modifier.
      - /:/host:ro,rslave
      - backup-metrics:/textfile:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
  loki-data:
