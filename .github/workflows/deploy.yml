# Deploiement en production, lance a la main : make deploy (ou gh workflow run deploy.yml)
# 1. staging : la nouvelle version est rejouee sur un runner ARM jetable (ADR 0037) ;
# 2. production : attend l'approbation de l'environnement GitHub "production", puis agit.
# Si le staging echoue, la production n'est pas touchee.
# GitHub ne detient qu'une cle SSH limitee a infra/deploy/deploy.sh : aucun secret applicatif.
name: Deploy
# Le titre du run porte l'action : le staging retrouve ainsi le dernier vrai deploiement.
run-name: Deploy (${{ inputs.action }})

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy, rollback ou status
        type: choice
        options: [deploy, rollback, status]
        default: deploy
      skip_staging:
        description: Urgence seulement - deployer sans staging (a consigner)
        type: boolean
        default: false

permissions:
  contents: read

# Un seul deploiement a la fois, jamais interrompu en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  staging:
    name: staging
    if: inputs.action == 'deploy' && !inputs.skip_staging
    # Meme architecture que la production (ARM).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuser toute autre branche que main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Le deploiement ne part que de main." >&2
          exit 1

      - name: Recuperer le code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trouver la version en production et la nouvelle version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Version en production = commit du dernier deploiement reussi.
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success \
            --limit 50 --json headSha,displayTitle \
            --jq '[.[] | select(.displayTitle == "Deploy (deploy)")][0].headSha // empty')
          if [ -z "$prev" ]; then
            # Runs anterieurs a ce titre : dernier run reussi, quel que soit son titre.
            prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty')
          fi
          [ -n "$prev" ] || { echo "Version en production introuvable" >&2; exit 1; }
          {
            # La version en production peut etre anterieure a l'image web (PR 35).
            ./infra/deploy/resolve-images.sh "$prev" --web-optional | sed 's/^/PREV_/'
            ./infra/deploy/resolve-images.sh "$GITHUB_SHA" | sed 's/^/NEW_/'
            echo "PREV_COMMIT=$prev"
            echo "NEW_COMMIT=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "### Staging : $prev -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$prev" = "$GITHUB_SHA" ]; then
            echo "Cette version est deja en production : redeploiement, sans retour arriere a verifier." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Installer age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Rejouer le deploiement sur un hote jetable
        run: ./infra/staging/staging-test.sh

  production:
    name: production (${{ inputs.action }})
    needs: staging
    # Le staging est saute pour rollback et status (et en urgence) ; un echec bloque la production.
    if: ${{ !cancelled() && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Les secrets de cet environnement ne sont fournis qu'apres approbation, et seulement pour main.
    environment: production
    env:
      ACTION: ${{ inputs.action }}
    steps:
      - name: Refuser toute autre branche que main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Le deploiement ne part que de main." >&2
          exit 1

      - name: Recuperer le code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trouver les images publiees pour ce commit
        if: inputs.action == 'deploy'
        run: |
          # Memes images que celles validees par le staging (meme commit, memes empreintes).
          ./infra/deploy/resolve-images.sh "$GITHUB_SHA" > images.env
          cat images.env >> "$GITHUB_ENV"
          image_commit=$(sed -n 's/^IMAGE_COMMIT=//p' images.env)
          api=$(sed -n 's/^API_DIGEST=//p' images.env)
          backup=$(sed -n 's/^BACKUP_DIGEST=//p' images.env)
          web_commit=$(sed -n 's/^WEB_IMAGE_COMMIT=//p' images.env)
          web=$(sed -n 's/^WEB_DIGEST=//p' images.env)
          {
            echo "### Version deployee"
            echo "Configuration : ${GITHUB_SHA}"
            echo "Images : ${image_commit} (API, sauvegarde), ${web_commit} (web)"
            echo
            echo "lorakus-api@${api}"
            echo
            echo "lorakus-backup@${backup}"
            echo
            echo "lorakus-web@${web}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparer la connexion SSH (empreinte du serveur verifiee)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Executer l'action sur le serveur
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # StrictHostKeyChecking=yes : connexion refusee si l'empreinte du serveur a change.
          remote() {
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ServerAliveInterval=30 -o ConnectTimeout=15 \
              "deploy@${DEPLOY_HOST}" "$1"
          }
          case "$ACTION" in
            deploy)
              full="deploy ${GITHUB_SHA} ${API_DIGEST} ${BACKUP_DIGEST} ${WEB_DIGEST}"
              # Le serveur execute son propre deploy.sh. Avant la PR 35, ce script refuse une
              # quatrieme empreinte : on deploie d'abord sans l'image web (ce qui installe le
              # nouveau script), puis on recommence avec elle. Ensuite, un seul passage.
              status=$(remote status)
              if grep -qx 'LORAKUS_DEPLOY_PROTOCOL=2' <<<"$status"; then
                remote "$full"
              else
                echo "::notice::Script de deploiement anterieur a l'image web : deploiement en deux passages"
                remote "deploy ${GITHUB_SHA} ${API_DIGEST} ${BACKUP_DIGEST}"
                status=$(remote status)
                grep -qx 'LORAKUS_DEPLOY_PROTOCOL=2' <<<"$status" \
                  || { echo "Le serveur n'a toujours pas le nouveau script" >&2; exit 1; }
                remote "$full"
              fi
              ;;
            rollback) remote rollback ;;
            status) remote status ;;
            *) echo "Action inconnue : $ACTION" >&2; exit 1 ;;
          esac

      - name: Effacer la cle
        if: always()
        run: rm -f ~/.ssh/deploy_key
