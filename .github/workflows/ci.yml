# Integration continue : chaque PR et chaque push sur main sont verifies.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Droits minimaux : le jeton de la CI peut seulement lire le depot.
permissions:
  contents: read

# Une nouvelle poussee sur la meme branche annule la verification en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dependances (versions exactes du lockfile)
        run: uv --directory backend sync --locked

      - name: Creer un .env jetable (mots de passe aleatoires, jamais reutilises)
        run: |
          cp .env.example .env
          for var in POSTGRES_PASSWORD LORAKUS_MIGRATOR_DB_PASSWORD LORAKUS_APP_DB_PASSWORD; do
            sed -i "s/^${var}=.*/${var}=$(openssl rand -hex 24)/" .env
          done

      - name: Lint, types, tests avec PostgreSQL, roles
        run: make check

      - name: Migrations rejouables (montee, descente, montee)
        run: make migrate-check

      - name: Evaluation de la recherche avec le vrai modele d'embeddings
        # Jeu etiquete (profil fictif) sur PostgreSQL et le vrai modele, verifie par SHA-256 :
        # la PR echoue si la recherche hybride passe sous ses garde-fous de regression (PR 37b).
        # Les chiffres sont publies dans le resume du job.
        env:
          LORAKUS_EMBEDDING_MODEL_DIR: ${{ runner.temp }}/embedding-model
          LORAKUS_EVAL_REPORT: ${{ runner.temp }}/memory-eval.json
        run: |
          ./infra/models/fetch-embedding-model.sh "$LORAKUS_EMBEDDING_MODEL_DIR"
          # Resume ecrit meme si l'evaluation echoue : c'est la qu'on lit pourquoi.
          status=0
          uv --directory backend run pytest -q -s tests/evals || status=$?
          {
            echo "### Recherche dans la memoire (recall@5, MRR)"
            echo "<details><summary>Rapport complet, classements par question compris</summary>"
            echo
            echo '```json'
            cat "$LORAKUS_EVAL_REPORT" 2>/dev/null || echo '{"erreur": "rapport absent"}'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Contrat OpenAPI du frontend a jour
        # Le client TypeScript est genere depuis frontend/openapi.json : s'il ne decrit plus
        # l'API, la PR echoue ici au lieu de casser l'interface en production.
        run: make openapi-check

      - name: Arreter PostgreSQL
        if: always()
        run: make db-down

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Installer pnpm (version figee dans package.json)
        run: npm install --global "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"

      - name: Installer les dependances (versions exactes du lockfile, 14 jours minimum)
        run: pnpm install --frozen-lockfile

      - name: Client de l'API genere a jour
        run: pnpm api:generate && git diff --exit-code -- src/api/schema.d.ts

      - name: Lint (ESLint strict, aucun appel fetch hors du client genere)
        run: pnpm lint

      - name: Types (TypeScript strict)
        run: pnpm typecheck

      - name: Tests (parcours, accessibilite, rendu sur)
        run: pnpm test

      - name: Construction
        run: pnpm build

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer tout l'historique
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Gitleaks (version figee, empreinte verifiee)
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
        run: |
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Rechercher des secrets dans tout l'historique
        run: ./gitleaks git --redact --verbose .

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l'image
        run: docker build -t lorakus-api:ci backend

      - name: Verifier demarrage, utilisateur, journaux JSON et metriques
        run: |
          docker run -d --name api-ci -p 127.0.0.1:8000:8000 -p 127.0.0.1:9464:9464 lorakus-api:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(docker inspect -f '{{.Config.User}}' api-ci)" = "lorakus"
          test "$(docker exec api-ci id -u)" = "10001"
          # Page lue d'abord : « curl | grep -q » echoue au hasard avec pipefail (pitfalls.md).
          page=$(curl -fsS http://127.0.0.1:9464/metrics)
          grep -qF 'lorakus_http_requests_total{method="GET",route="/api/health"' <<<"$page"
          docker logs api-ci 2>&1 | tail -n 1 | python3 -c 'import json, sys; json.loads(sys.stdin.read())'
          docker rm -f api-ci

      - name: Installer Trivy (version figee, empreinte verifiee)
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_VERSION: "0.76.1"
        run: |
          gh release download "v${TRIVY_VERSION}" --repo aquasecurity/trivy \
            --pattern "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --pattern "trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Secrets dans l'image (bloquant des HIGH)
        run: ./trivy image --scanners secret --exit-code 1 --severity HIGH,CRITICAL --no-progress --secret-config infra/ci/trivy-secret.yaml lorakus-api:ci

      - name: Vulnerabilites critiques corrigeables (bloquant)
        run: ./trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress --scanners vuln lorakus-api:ci

      - name: Vulnerabilites hautes (rapport, non bloquant)
        run: ./trivy image --exit-code 0 --severity HIGH --ignore-unfixed --no-progress --scanners vuln lorakus-api:ci

      - name: Construire l'image de sauvegarde
        run: docker build -t lorakus-backup:ci infra/backup

      - name: Secrets dans l'image de sauvegarde (bloquant des HIGH)
        run: ./trivy image --scanners secret --exit-code 1 --severity HIGH,CRITICAL --no-progress --secret-config infra/ci/trivy-secret.yaml lorakus-backup:ci

      - name: Vulnerabilites critiques corrigeables de l'image de sauvegarde (bloquant)
        run: ./trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress --scanners vuln lorakus-backup:ci

      - name: Creer un .env jetable pour la pile complete
        run: |
          cp .env.example .env
          for var in POSTGRES_PASSWORD LORAKUS_MIGRATOR_DB_PASSWORD LORAKUS_APP_DB_PASSWORD; do
            sed -i "s/^${var}=.*/${var}=$(openssl rand -hex 24)/" .env
          done

      - name: Pile complete en conteneurs (migrations puis API durcie)
        run: |
          make up
          curl -fsS http://127.0.0.1:8001/api/health/ready
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' lorakus-api-1)" = "true"
          ! docker exec lorakus-api-1 touch /app/intrusion

      - name: Arreter la pile
        if: always()
        # Si une etape precedente a echoue avant la creation du .env, la pile n'a jamais
        # demarre : rien a arreter, et make down echouerait sur le .env absent.
        run: if [ -f .env ]; then make down; else echo "Pile jamais demarree, rien a arreter."; fi
