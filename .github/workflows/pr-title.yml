# Verifie que le titre de la PR respecte Conventional Commits :
# apres un squash, ce titre devient le message du commit sur main.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verifier le format du titre
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            ci
            build
            perf
            revert
          requireScope: false
