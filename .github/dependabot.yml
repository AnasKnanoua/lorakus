# Mises a jour des dependances, proposees en PR chaque lundi.
# Elles passent par la CI et ne sont jamais fusionnees automatiquement.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Frontend (pnpm). Le delai de 14 jours est aussi impose par pnpm (minimumReleaseAge).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope

  # Image web (Caddy et Node de construction), epinglees par empreinte (ADR 0038).
  - package-ecosystem: docker
    directory: /infra/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build
      include: scope
